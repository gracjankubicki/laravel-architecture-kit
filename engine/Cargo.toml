[package]
name = "architecture-kit-engine"
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
libc = "=0.2.190"
mago-syntax = "=1.57.0"
mago-syntax-core = "=1.57.0"
mago-span = "=1.57.0"
mago-allocator = "=1.57.0"
mago-database = "=1.57.0"
mago-names = "=1.57.0"
mago-semantics = "=1.57.0"
mago-php-version = "=1.57.0"
mago-reporting = "=1.57.0"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
